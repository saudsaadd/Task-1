<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bahra Electric Reel</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Poppins', sans-serif; }
  #svg, #fg, #wipe { position: absolute; left: 0; top: 0; }
  #wipe { pointer-events: none; }
  text { font-family: 'Poppins', sans-serif; }
  .cardTitle { font-size: 40px; font-weight: 800; fill: #0D2340; }
  .cardSub { font-size: 25px; font-weight: 600; fill: #5A6B82; }
  .chipText { font-size: 24px; font-weight: 700; fill: #C21E23; }
  .tileText { font-size: 25px; font-weight: 700; fill: #0D2340; }
  .tagText { font-size: 27px; font-weight: 800; fill: #0D2340; }
  .badgeText { font-size: 30px; font-weight: 800; fill: #0D2340; }
  .iconText { font-size: 28px; font-weight: 700; fill: #0D2340; }

  #logoBar { position: absolute; left: 540px; top: 178px; width: 430px; height: 116px; margin: -58px 0 0 -215px; }
  #logoBar .pill { position: absolute; inset: 0; background: #fff; border-radius: 58px;
    box-shadow: 0 12px 30px rgba(13, 35, 64, .18); }
  #logoBar svg { position: absolute; left: 30px; top: 14px; width: 370px; height: 92px; overflow: visible; }
  #logoBar .shine { position: absolute; inset: 0; border-radius: 58px; overflow: hidden; }
  #logoBar .shine i { position: absolute; top: -20px; bottom: -20px; width: 60px; left: -120px;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.9), rgba(255,255,255,0));
    transform: skewX(-20deg); }

  .headline { position: absolute; left: 540px; top: 286px; width: 980px; margin-left: -490px;
    text-align: center; visibility: hidden; }
  .headline .card { display: inline-block; background: rgba(255,255,255,.95); border-radius: 44px;
    padding: 26px 46px 30px; box-shadow: 0 16px 40px rgba(13, 35, 64, .22); }
  .headline .card span { display: inline-block; font-size: 76px; line-height: 1.08; font-weight: 800;
    color: #0D2340; letter-spacing: -1px; margin: 0 9px; }
  .headline .card span.hl { color: #E3262B; }
  .headline .card br + span, .headline .card span:first-child { margin-left: 0; }
  #h2 .card span, #h3 .card span { font-size: 66px; }

  #caption { position: absolute; left: 540px; top: 1588px; width: 900px; margin-left: -450px; text-align: center; }
  #caption .pill { display: inline-block; background: rgba(10, 22, 44, .82); border-radius: 26px;
    padding: 12px 30px 14px; font-size: 48px; font-weight: 800; color: #fff; line-height: 1.15; }
  #caption .pill b { font-weight: 800; color: #fff; }
  #caption .pill b.on { color: #FFD23F; }

  #tagline { position: absolute; left: 0; width: 1080px; top: 668px; text-align: center; visibility: hidden; }
  #tagline .l1 { font-size: 50px; font-weight: 700; color: #0D2340; letter-spacing: 1px; }
  #tagline .l2 { font-size: 104px; font-weight: 900; color: #E3262B; line-height: 1.02; letter-spacing: -2px; }
  #tagline .rule { display: inline-block; width: 90px; height: 6px; border-radius: 3px; background: #2E6DB4;
    vertical-align: middle; margin: 0 18px 8px; }
  #cta { position: absolute; left: 540px; top: 968px; width: 640px; margin-left: -320px; height: 120px;
    visibility: hidden; }
  #cta .btn { position: absolute; inset: 0; border-radius: 60px; background: linear-gradient(180deg, #F0393E, #C81B20);
    box-shadow: 0 16px 34px rgba(200, 27, 32, .4), inset 0 -6px 0 rgba(0,0,0,.12);
    display: flex; align-items: center; justify-content: center; gap: 22px;
    color: #fff; font-size: 50px; font-weight: 800; letter-spacing: .5px; }
  #cta .ring { position: absolute; inset: 0; border-radius: 60px; border: 6px solid #E3262B; }
</style>
</head>
<body>
<div id="stage">
<svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <!-- Brand -->
    <mask id="bahraStripe" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="150">
      <rect width="600" height="150" fill="#fff"/>
      <rect x="0" y="57" width="600" height="5" fill="#000"/>
    </mask>
    <mask id="electricStripe" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="150">
      <rect width="600" height="150" fill="#fff"/>
      <rect x="0" y="119" width="600" height="3" fill="#000"/>
    </mask>
    <symbol id="emblem" viewBox="0 0 120 120">
      <ellipse cx="61" cy="58" rx="55" ry="51" transform="rotate(-28 61 58)" fill="#E3262B"/>
      <g transform="translate(58 68) skewX(-14) translate(-58 -68)">
        <path fill="#fff" fill-rule="evenodd" d="M22,42 H76 Q92,42 92,57 V60 Q92,68 84,71 Q94,75 94,85 V89 Q94,104 77,104 H22 Z
          M44,55 V66 H72 Q77,66 77,61 V60 Q77,55 72,55 Z M44,78 V91 H74 Q79,91 79,86 V83 Q79,78 74,78 Z"/>
        <rect x="36" y="38" width="6" height="70" fill="#E3262B"/>
        <rect x="10" y="70" width="40" height="5" fill="#E3262B"/>
      </g>
    </symbol>
    <symbol id="logo" viewBox="0 0 600 150">
      <use href="#emblem" x="0" y="6" width="136" height="136"/>
      <text x="146" y="96" mask="url(#bahraStripe)" style="font-family:Saira;font-style:italic;font-weight:900;font-stretch:125%"
        font-size="86" fill="#E3262B" textLength="444" lengthAdjust="spacingAndGlyphs">BAHRA</text>
      <text x="356" y="138" mask="url(#electricStripe)" style="font-family:Saira;font-style:italic;font-weight:800;font-stretch:125%"
        font-size="33" fill="#8C929C" textLength="234" lengthAdjust="spacingAndGlyphs">ELECTRIC</text>
    </symbol>

    <!-- Shared -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#0D2340" flood-opacity=".2"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <symbol id="cloud" viewBox="0 0 300 140" overflow="visible">
      <path d="M40,120 Q0,120 6,90 Q12,62 48,66 Q52,24 98,24 Q130,0 166,22 Q200,6 228,40 Q276,36 284,80 Q300,120 252,120 Z"/>
    </symbol>
    <symbol id="sparkle" viewBox="-20 -20 40 40" overflow="visible">
      <path fill="#FFD23F" d="M0,-20 Q3,-3 20,0 Q3,3 0,20 Q-3,3 -20,0 Q-3,-3 0,-20 Z"/>
    </symbol>
    <symbol id="ico-check" viewBox="-30 -30 60 60" overflow="visible">
      <circle r="28" fill="#22C55E" stroke="#fff" stroke-width="5"/>
      <path d="M-12,1 L-3,10 L13,-9" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ico-shield" viewBox="-100 -110 200 220" overflow="visible">
      <path fill="#1FA45A" d="M0,-104 L86,-72 Q90,30 0,104 Q-90,30 -86,-72 Z"/>
      <path fill="#2BC46E" d="M0,-86 L70,-60 Q72,22 0,84 Q-72,22 -70,-60 Z"/>
      <path d="M-34,0 L-8,26 L38,-28" stroke="#fff" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Scene 1 -->
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5DB8F0"/><stop offset=".55" stop-color="#B9E3FA"/><stop offset=".78" stop-color="#E6F6FF"/>
    </linearGradient>
    <radialGradient id="sunGlow"><stop offset="0" stop-color="#FFF4B8" stop-opacity=".95"/><stop offset="1" stop-color="#FFF4B8" stop-opacity="0"/></radialGradient>
    <pattern id="winA" width="38" height="50" patternUnits="userSpaceOnUse">
      <rect x="9" y="10" width="20" height="28" rx="3" fill="#FFE9A6"/>
    </pattern>
    <pattern id="winB" width="38" height="50" patternUnits="userSpaceOnUse">
      <rect x="9" y="10" width="20" height="28" rx="3" fill="#D6E8F9"/>
    </pattern>
    <pattern id="winF" width="56" height="36" patternUnits="userSpaceOnUse">
      <rect x="6" y="4" width="44" height="26" rx="3" fill="#BFD8EF"/>
    </pattern>

    <!-- Scene 2 -->
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F9FE"/><stop offset="1" stop-color="#D7E5F5"/>
    </linearGradient>
    <linearGradient id="cu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6B26B"/><stop offset="1" stop-color="#D2711F"/></linearGradient>
    <linearGradient id="al" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1F4F7"/><stop offset="1" stop-color="#AEB9C5"/></linearGradient>

    <!-- Scene 3 -->
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101D3A"/><stop offset=".42" stop-color="#22406F"/>
      <stop offset=".66" stop-color="#4E6A9C"/><stop offset=".8" stop-color="#E39463"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6F4A2E"/><stop offset="1" stop-color="#3E2716"/>
    </linearGradient>
    <pattern id="win3" width="56" height="64" patternUnits="userSpaceOnUse">
      <rect x="10" y="12" width="36" height="40" rx="4" fill="#FFD36E"/>
    </pattern>
    <pattern id="win3off" width="112" height="128" patternUnits="userSpaceOnUse">
      <rect x="66" y="12" width="36" height="40" rx="4" fill="#3F5F92"/>
      <rect x="10" y="76" width="36" height="40" rx="4" fill="#3F5F92"/>
    </pattern>

    <!-- Scene 4 -->
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3ECE2"/><stop offset="1" stop-color="#E2D4C2"/>
    </linearGradient>
    <radialGradient id="lampGlow"><stop offset="0" stop-color="#FFE7A8" stop-opacity=".95"/><stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/></radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9B0" stop-opacity=".7"/><stop offset="1" stop-color="#FFE9B0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="endBg" cx="540" cy="640" r="1300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#E6EFF9"/><stop offset="1" stop-color="#BFD4EC"/>
    </radialGradient>
  </defs>

  <!-- ============ SCENE 1 : smart city ============ -->
  <g id="s1">
    <rect width="1080" height="1920" fill="url(#sky1)"/>
    <g id="s1-sun" transform="translate(865 700)">
      <circle r="250" fill="url(#sunGlow)"/>
      <g id="s1-rays" fill="#FFE27A" opacity=".6"></g>
      <circle r="92" fill="#FFCC3D"/><circle r="74" fill="#FFDD66"/>
    </g>
    <g id="s1-clouds">
      <use class="cloud" fill="#fff" href="#cloud" width="300" height="140" data-x="60" data-y="600" data-s="1" data-v="14"/>
      <use class="cloud" fill="#fff" href="#cloud" width="300" height="140" data-x="620" data-y="560" data-s=".75" data-v="9"/>
      <use class="cloud" fill="#fff" href="#cloud" width="300" height="140" data-x="380" data-y="820" data-s=".55" data-v="20"/>
      <use class="cloud" fill="#fff" href="#cloud" width="300" height="140" data-x="900" data-y="900" data-s=".6" data-v="12"/>
    </g>
    <path fill="#A7CAEA" d="M0,1430 V1250 H60 V1190 H130 V1270 H170 V1150 H250 V1230 H300 V1290 H350 V1170 H420 V1110 H470 V1200 H540 V1260 H600 V1160 H660 V1230 H720 V1140 H800 V1250 H860 V1190 H930 V1270 H980 V1170 H1040 V1240 H1080 V1430 Z"/>
    <path fill="#9AD19A" d="M520,1470 Q760,1290 1080,1320 V1470 Z"/>
    <g id="s1-turbines">
      <g transform="translate(790 1150)">
        <path d="M-5,0 L5,0 L10,210 L-10,210 Z" fill="#F7FAFD" stroke="#9FB4C8" stroke-width="2"/>
        <g class="rotor"><path d="M0,0 C7,-30 7,-90 0,-118 C-5,-90 -7,-30 0,0 Z" fill="#fff" stroke="#9FB4C8" stroke-width="2"/>
          <path transform="rotate(120)" d="M0,0 C7,-30 7,-90 0,-118 C-5,-90 -7,-30 0,0 Z" fill="#fff" stroke="#9FB4C8" stroke-width="2"/>
          <path transform="rotate(240)" d="M0,0 C7,-30 7,-90 0,-118 C-5,-90 -7,-30 0,0 Z" fill="#fff" stroke="#9FB4C8" stroke-width="2"/></g>
        <circle r="8" fill="#E6EEF6" stroke="#9FB4C8" stroke-width="2"/>
      </g>
      <g transform="translate(965 1205) scale(.78)">
        <path d="M-5,0 L5,0 L10,210 L-10,210 Z" fill="#F7FAFD" stroke="#9FB4C8" stroke-width="2"/>
        <g class="rotor" data-phase="40"><path d="M0,0 C7,-30 7,-90 0,-118 C-5,-90 -7,-30 0,0 Z" fill="#fff" stroke="#9FB4C8" stroke-width="2"/>
          <path transform="rotate(120)" d="M0,0 C7,-30 7,-90 0,-118 C-5,-90 -7,-30 0,0 Z" fill="#fff" stroke="#9FB4C8" stroke-width="2"/>
          <path transform="rotate(240)" d="M0,0 C7,-30 7,-90 0,-118 C-5,-90 -7,-30 0,0 Z" fill="#fff" stroke="#9FB4C8" stroke-width="2"/></g>
        <circle r="8" fill="#E6EEF6" stroke="#9FB4C8" stroke-width="2"/>
      </g>
    </g>
    <g id="s1-grid">
      <path d="M30,1250 V1500 M540,1235 V1500 M1050,1250 V1500" stroke="#6F8BA8" stroke-width="7"/>
      <path d="M10,1252 H52 M520,1237 H560 M1030,1252 H1070" stroke="#6F8BA8" stroke-width="6" stroke-linecap="round"/>
      <path id="s1-wire" d="M30,1256 Q285,1316 540,1241 Q795,1316 1050,1256" stroke="#4F6680" stroke-width="3.5" fill="none"/>
      <g id="s1-dots"></g>
    </g>
    <g id="s1-city">
      <rect x="400" y="1250" width="140" height="250" fill="#5B8CC6"/><rect x="410" y="1262" width="120" height="230" fill="url(#winA)"/>
      <rect x="540" y="1160" width="120" height="340" fill="#4876B1"/><rect x="550" y="1172" width="100" height="320" fill="url(#winB)"/>
      <rect x="566" y="1120" width="68" height="40" fill="#4876B1"/>
      <rect x="660" y="1280" width="170" height="220" fill="#6A9AD0"/><rect x="672" y="1292" width="146" height="200" fill="url(#winA)"/>
      <path d="M672,1280 L700,1250 L800,1250 L818,1280 Z" fill="#2B4A78"/>
      <path d="M700,1250 L800,1250 M716,1250 L702,1280 M750,1250 L745,1280 M784,1250 L788,1280" stroke="#7FA6D6" stroke-width="2"/>
      <rect x="830" y="1210" width="130" height="290" fill="#5481BC"/><rect x="840" y="1222" width="110" height="270" fill="url(#winB)"/>
      <rect x="960" y="1300" width="120" height="200" fill="#4876B1"/><rect x="968" y="1312" width="104" height="180" fill="url(#winA)"/>
    </g>
    <g id="s1-factory">
      <rect x="64" y="1170" width="46" height="170" fill="#DCE2EA" stroke="#A9B8C9" stroke-width="3"/>
      <rect x="64" y="1192" width="46" height="14" fill="#E3262B"/><rect x="64" y="1226" width="46" height="14" fill="#E3262B"/>
      <g id="s1-steam" fill="#fff"></g>
      <path fill="#CBD5E1" stroke="#A9B8C9" stroke-width="3" d="M14,1334 L14,1290 L92,1334 L92,1290 L170,1334 L170,1290 L248,1334 L248,1290 L326,1334 L326,1290 L398,1334 Z"/>
      <path fill="#7FB0E0" d="M16,1294 L88,1334 L16,1334 Z M94,1294 L166,1334 L94,1334 Z M172,1294 L244,1334 L172,1334 Z M250,1294 L322,1334 L250,1334 Z" opacity=".6"/>
      <rect x="14" y="1334" width="384" height="170" fill="#F1F4F8" stroke="#A9B8C9" stroke-width="3"/>
      <rect x="30" y="1350" width="350" height="36" fill="url(#winF)"/>
      <rect x="14" y="1396" width="384" height="14" fill="#E3262B"/>
      <use href="#emblem" x="34" y="1422" width="70" height="70"/>
      <rect x="290" y="1424" width="80" height="80" fill="#9FB0C2" stroke="#7E91A6" stroke-width="3"/>
      <path d="M290,1444 H370 M290,1464 H370 M290,1484 H370" stroke="#7E91A6" stroke-width="3"/>
    </g>
    <rect y="1500" width="1080" height="420" fill="#DDE6EF"/>
    <path d="M0,1500 H1080 V1540 H0 Z" fill="#86C77A"/>
    <g fill="#6FB866">
      <circle cx="140" cy="1500" r="26"/><circle cx="176" cy="1494" r="30"/><circle cx="212" cy="1502" r="22"/>
      <circle cx="880" cy="1500" r="24"/><circle cx="914" cy="1492" r="30"/><circle cx="950" cy="1502" r="22"/>
    </g>
    <path d="M540,1540 L-400,1920 M540,1540 L200,1920 M540,1540 L880,1920 M540,1540 L1480,1920 M0,1640 H1080 M0,1790 H1080"
      stroke="#C9D5E2" stroke-width="4"/>

    <g id="s1-badgeL" transform="translate(178 1150)">
      <g class="pop">
        <circle r="78" fill="#fff" filter="url(#shadow)"/>
        <g transform="translate(0 -6)">
          <circle cy="-12" r="34" fill="#FFD23F" stroke="#263042" stroke-width="4"/>
          <path d="M-14,18 H14 V34 Q14,40 8,40 H-8 Q-14,40 -14,34 Z" fill="#9AA5B1" stroke="#263042" stroke-width="4"/>
          <path d="M-10,-14 L-2,-4 L-2,16 M10,-14 L2,-4 L2,16" stroke="#C98A16" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M-56,-40 L-44,-34 M56,-40 L44,-34 M0,-66 V-56 M-40,-64 L-32,-54 M40,-64 L32,-54" stroke="#FFB800" stroke-width="5" stroke-linecap="round"/>
        </g>
        <rect x="-98" y="96" width="196" height="50" rx="25" fill="#0D2340"/>
        <text y="131" text-anchor="middle" style="font-size:28px;font-weight:800;fill:#fff">Innovation</text>
      </g>
    </g>
    <g id="s1-badgeR" transform="translate(902 1150)">
      <g class="pop">
        <circle r="78" fill="#fff" filter="url(#shadow)"/>
        <use href="#ico-shield" x="-46" y="-52" width="92" height="101"/>
        <rect x="-80" y="96" width="160" height="50" rx="25" fill="#0D2340"/>
        <text y="131" text-anchor="middle" style="font-size:28px;font-weight:800;fill:#fff">Safety</text>
      </g>
    </g>
    <g id="s1-bubble" transform="translate(812 905)">
      <g class="pop">
        <path d="M-190,-62 H190 Q222,-62 222,-30 V30 Q222,62 190,62 H-60 L-130,108 L-112,62 H-190 Q-222,62 -222,30 V-30 Q-222,-62 -190,-62 Z"
          fill="#fff" stroke="#0D2340" stroke-width="5" filter="url(#shadow)"/>
        <text y="16" text-anchor="middle" style="font-size:46px;font-weight:800;fill:#0D2340">Hi, I'm <tspan fill="#E3262B">Sparky!</tspan></text>
      </g>
    </g>
  </g>

  <!-- ============ SCENE 2 : products ============ -->
  <g id="s2" visibility="hidden">
    <rect width="1080" height="1920" fill="url(#bg2)"/>
    <circle cx="1010" cy="640" r="280" fill="#E4EEFA"/>
    <circle cx="40" cy="1060" r="230" fill="#E8F0FA"/>
    <path d="M-100,560 L560,-100 L700,-100 L40,560 Z M-100,820 L820,-100 L880,-100 L-40,820 Z" fill="#2E6DB4" opacity=".05"/>
    <rect y="1556" width="1080" height="364" fill="#C9D9EB"/>
    <rect y="1548" width="1080" height="14" fill="#B2C5DB"/>
    <path d="M540,1430 L-600,1920 M540,1430 L-120,1920 M540,1430 L320,1920 M540,1430 L760,1920 M540,1430 L1200,1920 M540,1430 L1680,1920 M0,1612 H1080 M0,1700 H1080 M0,1830 H1080"
      stroke="#BACCE2" stroke-width="4"/>
    <g id="s2-cable">
      <path d="M406,724 V1296" stroke="#263042" stroke-width="16" stroke-linecap="round"/>
      <path d="M406,724 V1296" stroke="#3A414B" stroke-width="9" stroke-linecap="round"/>
      <path id="s2-cableGlow" d="M406,724 V1296" stroke="#FFD23F" stroke-width="9" stroke-linecap="round" filter="url(#glow)"
        stroke-dasharray="60 572" stroke-dashoffset="0" opacity="0"/>
      <circle cx="406" cy="724" r="13" fill="#E3262B" stroke="#263042" stroke-width="3"/>
      <circle cx="406" cy="1010" r="13" fill="#E3262B" stroke="#263042" stroke-width="3"/>
      <circle cx="406" cy="1296" r="13" fill="#E3262B" stroke="#263042" stroke-width="3"/>
    </g>

    <g id="card1" transform="translate(410 600)"><g class="pop">
      <rect class="cardGlow" x="-6" y="-6" width="632" height="262" rx="40" fill="none" stroke="#2E6DB4" stroke-width="6" opacity="0"/>
      <rect width="620" height="250" rx="34" fill="#fff" filter="url(#shadow)"/>
      <rect x="18" y="18" width="214" height="214" rx="26" fill="#EAF2FC"/>
      <g transform="translate(118 122)">
        <circle cx="9" cy="-5" r="80" fill="#A86F3C" stroke="#263042" stroke-width="3.5"/>
        <circle r="80" fill="#C98B4F" stroke="#263042" stroke-width="3.5"/>
        <circle r="63" fill="#2B2F36"/>
